.j-stat-lbl{font-size:9px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:var(--text3);}

.log-form{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:16px;}
.log-form-title{font-size:13px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.f-group{display:flex;flex-direction:column;gap:5px;}
.f-label{font-size:10px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;color:var(--text3);}
.f-input,.f-select,.f-textarea{background:var(--card2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--font);font-size:13px;padding:9px 12px;outline:none;transition:border-color 0.15s;width:100%;}
.f-input:focus,.f-select:focus,.f-textarea:focus{border-color:var(--teal);}
.f-select option{background:var(--card2);}
.f-textarea{resize:vertical;min-height:60px;line-height:1.5;}
.log-btn{width:100%;padding:12px;border-radius:12px;background:linear-gradient(90deg,var(--teal),var(--blue));color:#fff;font-family:var(--font);font-size:13px;font-weight:700;border:none;cursor:pointer;margin-top:6px;transition:opacity 0.15s;display:flex;align-items:center;justify-content:center;gap:8px;}
.log-btn:disabled{opacity:0.6;cursor:not-allowed;}
.trade-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:8px;transition:border-color 0.15s;}
.trade-card:hover{border-color:var(--border2);}
.tc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.tc-pair{font-size:15px;font-weight:800;letter-spacing:-0.3px;}
.tc-pnl{font-size:15px;font-weight:800;}
.tc-pnl.pos{color:var(--green);}.tc-pnl.neg{color:var(--red);}
.tc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tc-tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--text2);border:1px solid var(--border);}
.tc-tag.long{color:var(--green);border-color:rgba(45,219,129,0.2);background:rgba(45,219,129,0.06);}
.tc-tag.short{color:var(--red);border-color:rgba(255,82,82,0.2);background:rgba(255,82,82,0.06);}
.tc-tag.win{color:var(--teal);border-color:rgba(0,207,255,0.25);background:rgba(0,207,255,0.08);}
.tc-tag.loss{color:var(--red);border-color:rgba(255,82,82,0.2);background:rgba(255,82,82,0.06);}
.tc-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:4px;transition:color 0.15s;}
.tc-del:hover{color:var(--red);}
.pair-wr-title{font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}
.pair-wr-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.pair-wr-name{font-size:11px;font-weight:700;min-width:64px;color:var(--text);}
.pair-wr-bar-track{flex:1;height:4px;background:var(--card2);border-radius:99px;}
.pair-wr-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:99px;}
.pair-wr-pct{font-size:11px;font-weight:700;color:var(--teal);min-width:34px;text-align:right;}

/* \u2500\u2500 Asset Picker Modal \u2500\u2500 */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn 0.2s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-sheet{
  width:100%;max-width:480px;background:var(--bg2);
  border-radius:20px 20px 0 0;padding:0 0 32px;
  border:1px solid var(--border2);border-bottom:none;
  animation:slideUp 0.25s ease;max-height:90vh;overflow-y:auto;
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:99px;margin:12px auto 0;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;}
.modal-title{font-size:17px;font-weight:800;letter-spacing:-0.4px;}
.modal-close{background:var(--card);border:1px solid var(--border2);color:var(--text2);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;}
.modal-sub{font-size:12px;color:var(--text3);padding:0 20px;margin-bottom:16px;}
.asset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px;}
.asset-toggle{
  padding:12px 8px;border-radius:12px;background:var(--card);border:1px solid var(--border);
  text-align:center;cursor:pointer;transition:all 0.15s;
  font-family:var(--font);
}
.asset-toggle:hover{border-color:var(--border2);}
.asset-toggle.selected{background:rgba(0,207,255,0.1);border-color:var(--teal);}
.asset-toggle-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:2px;}
.asset-toggle-check{font-size:14px;}
.modal-save-btn{
  width:calc(100% - 40px);margin:16px 20px 0;padding:13px;border-radius:12px;
  background:linear-gradient(90deg,var(--teal),var(--blue));
  color:#fff;font-family:var(--font);font-size:13px;font-weight:700;
  border:none;cursor:pointer;
}

/* Bottom Nav */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:var(--bg2);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;align-items:center;
  padding:10px 0 16px;z-index:50;
}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;min-width:60px;padding:4px 8px;background:none;border:none;transition:all 0.15s;}
.bn-icon{font-size:20px;transition:transform 0.15s;}
.bn-label{font-size:9px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;color:var(--text3);transition:color 0.15s;}
.bn-item.active .bn-label{color:var(--teal);}
.bn-item.active .bn-icon{transform:translateY(-2px);}

.empty-state{text-align:center;padding:40px 16px;color:var(--text3);font-size:13px;}
.divider{height:1px;background:var(--border);margin:16px 0;}
