// Universal API call — no custom headers, works on all browsers including mobile Safari
async function callClaude(system, user, maxTokens = 1500) {
  const controller = new AbortController();
  const tid = setTimeout(() => controller.abort(), 45000);
  try {
    const res = await fetch(CLAUDE_API, {
      method: "POST",
      signal: controller.signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: maxTokens,
        system,
        messages: [{ role: "user", content: user }],
      }),
    });
    clearTimeout(tid);
    // Always read JSON body first — the worker always returns JSON even on errors
    let data;
    try { data = await res.json(); } catch { throw new Error(`Worker returned non-JSON (HTTP ${res.status})`); }
    if (!res.ok || data.error) throw new Error(data.error?.message || `HTTP ${res.status}`);
    return data.content?.filter(b => b.type === "text").map(b => b.text).join("") || "";
  } catch (e) {
    clearTimeout(tid);
    if (e.name === "AbortError") throw new Error("Request timed out. Check your connection and tap Refresh.");
    throw e;
  }
}

// Alias — both use same function now
const callClaudeFast = (system, user) => callClaude(system, user, 1500);

// ─── Yahoo Finance symbol map ─────────────────────────────────────────────────
const YAHOO_MAP = {
  "EUR/USD":"EURUSD=X","GBP/USD":"GBPUSD=X","USD/JPY":"USDJPY=X",
  "XAU/USD":"GC=F","NAS100":"NQ=F","US30":"YM=F","US500":"ES=F",
  "BTC/USD":"BTC-USD","ETH/USD":"ETH-USD","OIL/USD":"CL=F",
  "USD/CAD":"USDCAD=X","AUD/USD":"AUDUSD=X","EUR/AUD":"EURAUD=X",
  "EUR/GBP":"EURGBP=X","GBP/JPY":"GBPJPY=X","USD/CHF":"USDCHF=X",
  "EUR/JPY":"EURJPY=X","GBP/AUD":"GBPAUD=X","AUD/JPY":"AUDJPY=X",
  "XAG/USD":"SI=F","GER40":"^GDAXI","UK100":"^FTSE",
};

function fmtPrice(pair, p) {
  if (p == null) return "—";
  if (["XAU/USD","US30","NAS100","US500","BTC/USD","ETH/USD"].includes(pair))
    return p.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});
  if (["USD/JPY","GBP/JPY","EUR/JPY","AUD/JPY"].includes(pair)) return p.toFixed(2);
  return p.toFixed(4);
}

async function fetchLivePrices(assets) {
  try {
    const syms = assets.map(a => YAHOO_MAP[a]).filter(Boolean).join(",");
    if (!syms) return {};
    const res = await fetch(`${CLAUDE_API}/prices?symbols=${encodeURIComponent(syms)}`);
    if (!res.ok) return {};
    const data = await res.json();
    if (data.error) return {};
    const out = {};
    assets.forEach(a => {
      const ys = YAHOO_MAP[a];
      const q = ys && data[ys];
      if (q && q.price != null) {
        const pct = q.changePercent || 0;
        out[a] = { price: fmtPrice(a, q.price), changePercent: pct, change: (pct>=0?"+":"")+pct.toFixed(2)+"%", up: pct>=0 };
      }
    });
    return out;
  } catch { return {}; }
}

async function fetchNewsHeadlines(asset) {
  try {
    const sym = YAHOO_MAP[asset];
    if (!sym) return [];
    const res = await fetch(`${CLAUDE_API}/news?symbol=${encodeURIComponent(sym)}`);
    if (!res.ok) return [];
    const data = await res.json();
    return data.headlines || [];
  } catch { return []; }
}

function getHour(tz) {
  return parseInt(new Intl.DateTimeFormat("en-US",{hour:"numeric",hour12:false,timeZone:tz}).format(new Date()));
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return "Good morning";
  if (h < 17) return "Good afternoon";
  return "Good evening";
}

function formatPairKey(pair) {
  return pair.replace("/","");
}

// ─── Ticker ───────────────────────────────────────────────────────────────────
const TICKER_PAIRS = ["EUR/USD","GBP/USD","XAU/USD","USD/JPY","NAS100","US30","BTC/USD","OIL/USD"];

// Static fallback prices shown until live data arrives
const TICKER_STATIC = {
  "EUR/USD":{price:"—",chg:"—",up:true},
  "GBP/USD":{price:"—",chg:"—",up:true},
  "XAU/USD":{price:"—",chg:"—",up:true},
  "USD/JPY":{price:"—",chg:"—",up:true},
  "NAS100": {price:"—",chg:"—",up:true},
  "US30":   {price:"—",chg:"—",up:true},
  "BTC/USD":{price:"—",chg:"—",up:true},
  "OIL/USD":{price:"—",chg:"—",up:true},
};

function Ticker({ livePrices }) {
  const items = TICKER_PAIRS.map(pair => {
    const live = livePrices?.[pair];
    const stat = TICKER_STATIC[pair];
    return { pair, price: live?.price ?? stat.price, chg: live?.change ?? stat.chg, up: live != null ? live.up : stat.up };
  });
  const doubled = [...items,...items];
  return (
    <div className="ticker-wrap">
      <div className="ticker-track">
        {doubled.map((item,i) => (
          <div className="ticker-item" key={i}>
            <span className="ticker-pair">{item.pair}</span>
            <span className="ticker-price">{item.price}</span>
            <span className={`ticker-chg ${item.up?"up":"dn"}`}>{item.chg}</span>
            {i<doubled.length-1&&<div className="ticker-sep"/>}
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Sessions ─────────────────────────────────────────────────────────────────
function Sessions() {
  const getStatus = s => {
    const h = getHour(s.tz);
    if (h>=s.open&&h<s.close) return "open";
    if (h>=s.open-1&&h<s.open) return "premarket";
    return "afterhours";
  };
  const getLabel = st => ({open:"OPEN",premarket:"PRE MARKET",afterhours:"AFTER HOURS"}[st]);
  const getNote  = (s,st) => {
    const h = getHour(s.tz);
    if (st==="open") return `closes in ${s.close-h}h`;
    if (st==="premarket") return "opens in ~1h";
    return `opens in ~${(s.open+24-h)%24}h`;
  };
  return (
    <div className="sessions-card">
      {SESSIONS_DEF.map(s => {
        const st = getStatus(s);
        return (
          <div className="session-item" key={s.name}>
            <div className="session-top">
              <div className={`session-dot ${st==="open"?"open":st==="premarket"?"premarket":"closed"}`}/>
              <span className="session-name">{s.name}</span>
            </div>
            <span className={`session-status-label ${st}`}>{getLabel(st)}</span>
            <span className="session-time">{getNote(s,st)}</span>
          </div>
        );
      })}
    </div>
  );
}

// ─── Asset Picker Modal ───────────────────────────────────────────────────────
function AssetPickerModal({ title, subtitle, current, onSave, onClose }) {
  const [selected, setSelected] = useState(new Set(current));
  const toggle = a => {
    setSelected(prev => {
      const n = new Set(prev);
      if (n.has(a)) { if (n.size>1) n.delete(a); }
      else n.add(a);
      return n;
    });
  };
  return (
    <div className="modal-overlay" onClick={e => e.target===e.currentTarget&&onClose()}>
      <div className="modal-sheet">
        <div className="modal-handle"/>
        <div className="modal-header">
          <div className="modal-title">{title}</div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-sub">{subtitle}</div>
        <div className="asset-grid">
          {ALL_AVAILABLE_ASSETS.map(a => {
            const sel = selected.has(a);
            return (
              <div key={a} className={`asset-toggle ${sel?"selected":""}`} onClick={()=>toggle(a)}>
                <div className="asset-toggle-name">{a}</div>
                <div className="asset-toggle-check">{sel?"✦":"○"}</div>
              </div>
            );
          })}
        </div>
        <button className="modal-save-btn" onClick={()=>onSave([...selected])}>
          Save {selected.size} Asset{selected.size!==1?"s":""}
        </button>
      </div>
    </div>
  );
}

// ─── Storage helpers (window.storage in artifact env, localStorage everywhere else)
async function storageGet(key) {
  try { const r = await window.storage.get(key); if (r?.value) return JSON.parse(r.value); } catch {}
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch { return null; }
}
async function storageSet(key, val) {
  const s = JSON.stringify(val);
  try { await window.storage.set(key, s); } catch {}
  try { localStorage.setItem(key, s); } catch {}
}

// ─── Profile Modal ────────────────────────────────────────────────────────────
function ProfileModal({ name, avatar, onSave, onClose }) {
  const [draftName,   setDraftName]   = useState(name);
  const [draftAvatar, setDraftAvatar] = useState(avatar); // base64 or null
  const fileRef = useRef();

  const handleImage = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => setDraftAvatar(ev.target.result);
    reader.readAsDataURL(file);
  };

  const initials = draftName ? draftName.trim().split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2) : "?";

  return (
    <div className="profile-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="profile-sheet">
        <div className="profile-handle"/>
        <div className="profile-header">
          <div className="profile-title">Your Profile</div>
          <button className="profile-close" onClick={onClose}>✕</button>
        </div>

        <div className="profile-avatar-wrap">
          <div className="profile-avatar-big" onClick={()=>fileRef.current.click()}>
            {draftAvatar
              ? <img src={draftAvatar} alt="avatar"/>
              : <span>{initials}</span>}
            <div className="profile-avatar-overlay">📷</div>
          </div>
          <div className="profile-avatar-hint">Tap to change photo</div>
          <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleImage}/>
        </div>

        <div className="profile-body">
          <div className="f-group">
            <label className="f-label">Display Name</label>
            <input
              className="f-input"
              value={draftName}
              onChange={e=>setDraftName(e.target.value)}
              placeholder="Your name"
            />
          </div>
          <button className="profile-save-btn" onClick={()=>onSave(draftName, draftAvatar)}>
            Save Changes
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("home");
  const [showProfile, setShowProfile] = useState(false);

  // User profile
  const [userName,   setUserName]   = useState(USER_NAME);
  const [userAvatar, setUserAvatar] = useState(null);

  // Shared state — loaded once, passed down
  const [macroAssets,  setMacroAssets]  = useState(DEFAULT_MACRO_ASSETS);
  const [briefAssets,  setBriefAssets]  = useState(DEFAULT_BRIEF_ASSETS);
  const [macroData,    setMacroData]    = useState({});
  const [macroLoading, setMacroLoading] = useState(false);
  const [livePrices,   setLivePrices]   = useState({});
  const macroFetched = useRef(false);

  // Load saved prefs
  useEffect(() => {
    (async () => {
      const ma = await storageGet("atlas_macro_assets");
      if (ma) setMacroAssets(ma);
      const ba = await storageGet("atlas_brief_assets");
      if (ba) setBriefAssets(ba);
      const profile = await storageGet("atlas_profile");
      if (profile?.name)   setUserName(profile.name);
      if (profile?.avatar) setUserAvatar(profile.avatar);
    })();
  }, []);

  // Auto-fetch macro on mount (once)
  useEffect(() => {
    if (!macroFetched.current) {
      macroFetched.current = true;
      fetchMacro(macroAssets);
    }
  }, []);

  // Fetch live prices on mount and refresh every 60s
  useEffect(() => {
    const load = () => fetchLivePrices(TICKER_PAIRS).then(p => { if (Object.keys(p).length) setLivePrices(p); });
    load();
    const iv = setInterval(load, 60000);
    return () => clearInterval(iv);
  }, []);

  const fetchMacro = async (assets) => {
    setMacroLoading(true);
    setMacroData({});
    try {
      const keys = assets.map(formatPairKey);
      // Fetch live prices to ground the AI analysis
      const prices = await fetchLivePrices(assets);
      const priceLines = assets.map(a => {
        const p = prices[a];
        return p ? `${a}: ${p.price} (${p.change})` : null;
      }).filter(Boolean);
      const priceCtx = priceLines.length > 0
        ? `\nCurrent live prices: ${priceLines.join(", ")}.`
        : "";
      const result = await callClaude(
        `You are an institutional-grade Smart Money Concepts (SMC) analyst. Your analysis is based exclusively on ICT/SMC methodology — NOT retail indicators or chart patterns. Use your deep knowledge of current market structure, DXY flows, liquidity levels, and institutional order flow.

Return ONLY valid JSON (no markdown, no preamble) with this exact structure:
{
  "XAUUSD": { "bias": "bearish", "confidence": 78, "change": "-0.8%", "up": false, "analysis": "3-4 sentence SMC analysis covering: institutional bias (BSL or SSL being targeted), key premium/discount levels, recent CHoCH or BOS, and the HTF POI price is heading toward. Include specific approximate price levels." }
}
bias must be exactly 'bullish', 'bearish', or 'neutral'. confidence 40-95. Return ONLY the JSON object.`,
        `Today is ${new Date().toDateString()}.${priceCtx} Provide SMC analysis for these assets: ${keys.join(", ")}. Base your analysis on current market structure, key liquidity levels, DXY correlation, and HTF bias. Use asset names without slash as JSON keys.`
      );
      const clean = result.replace(/```json|```/g,"").trim();
      const s=clean.indexOf("{"), e=clean.lastIndexOf("}");
      if (s!==-1 && e!==-1) {
        const parsed = JSON.parse(clean.slice(s,e+1));
        const normalised = {};
        assets.forEach(asset => {
          normalised[asset] = parsed[formatPairKey(asset)] || parsed[asset] || null;
        });
        setMacroData(normalised);
      } else {
        // Partial fallback — mark all as error
        const err = {};
        assets.forEach(a => { err[a] = { bias:"neutral", confidence:0, change:"—", up:false, analysis:"Could not parse response. Tap Refresh to retry." }; });
        setMacroData(err);
      }
    } catch(e) {
      const err = {};
      assets.forEach(a => { err[a] = { bias:"neutral", confidence:0, change:"—", up:false, analysis:`Error: ${e.message}` }; });
      setMacroData(err);
    }
    setMacroLoading(false);
  };

  const saveMacroAssets = async (assets) => {
    setMacroAssets(assets);
    await storageSet("atlas_macro_assets", assets);
    fetchMacro(assets);
  };

  const saveBriefAssets = async (assets) => {
    setBriefAssets(assets);
    await storageSet("atlas_brief_assets", assets);
  };

  const saveProfile = async (name, avatar) => {
    setUserName(name || USER_NAME);
    setUserAvatar(avatar);
    await storageSet("atlas_profile", { name: name || USER_NAME, avatar });
    setShowProfile(false);
  };

  // Avatar initials for nav
  const navInitials = userName.trim().split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);

  return (
    <>
      <style>{css}</style>
      <div className="app">
        <nav className="nav">
          <div className="nav-left">
            <div className="nav-logo">
              <span className="nav-brand">GEMINI<span style={{color:"var(--teal)",marginLeft:2}}>.</span></span>
            </div>
          </div>
          <div className="nav-right">
            <div className="nav-avatar" onClick={()=>setShowProfile(true)}>
              {userAvatar ? <img src={userAvatar} alt="avatar"/> : navInitials}
            </div>
          </div>
        </nav>

        <div className="scroll-content">
          {tab==="home"    && <HomeTab macroAssets={macroAssets} macroData={macroData} macroLoading={macroLoading} onRefresh={()=>fetchMacro(macroAssets)} onEditAssets={saveMacroAssets} setTab={setTab} userName={userName} livePrices={livePrices}/>}
          {tab==="brief"   && <BriefTab briefAssets={briefAssets} onEditAssets={saveBriefAssets}/>}
          {tab==="cal"     && <CalendarTab/>}
          {tab==="journal" && <JournalTab/>}
        </div>

        <div className="bottom-nav">
          {TABS.map(t=>(
            <button key={t.id} className={`bn-item ${tab===t.id?"active":""}`} onClick={()=>setTab(t.id)}>
              <span className="bn-icon">{t.icon}</span>
              <span className="bn-label">{t.label}</span>
            </button>
          ))}
        </div>

        {showProfile && (
          <ProfileModal
            name={userName}
            avatar={userAvatar}
            onSave={saveProfile}
            onClose={()=>setShowProfile(false)}
          />
        )}
      </div>
    </>
  );
}

function parseBrief(text) {
  // Parse the structured AI response into sections
  const sections = {};
  const lines = text.split("\n");
  let current = null;
  lines.forEach(line => {
    const trimmed = line.trim();
    if (!trimmed) return;
    const isHeader = /^[A-Z &\/]+:$/.test(trimmed) || /^(PRICE|TECHNICAL|FUNDAMENTAL|LATEST|WATCH|BIAS|OVERVIEW)/.test(trimmed);
    if (isHeader) { current = trimmed.replace(/:$/,""); sections[current]=[]; }
    else if (current) sections[current].push(trimmed);
  });
  // Fallback: return raw text
  if (Object.keys(sections).length < 2) return null;
  return sections;
}

  // Fetch briefs — one call per asset in parallel, plain text (no JSON parsing)
  const fetchSingleBrief = async (asset) => {
    // Fetch live price + news in parallel with the AI call
    const [liveData, headlines] = await Promise.all([
      fetchLivePrices([asset]),
      fetchNewsHeadlines(asset),
    ]);
    const priceCtx = liveData[asset]
      ? `Current price: ${liveData[asset].price} (${liveData[asset].change}). `
      : "";
    const newsCtx = headlines.length > 0
      ? `\nRecent headlines: ${headlines.slice(0,3).join(" | ")}.`
      : "";

      `You are an institutional Smart Money Concepts (SMC) analyst. Write a single paragraph of exactly 120-150 words as plain text — no headers, no bullets, no JSON, no markdown. Cover: (1) current HTF market structure and most recent BOS or CHoCH, (2) where BSL and SSL sit with approximate price levels, (3) the most relevant order block or FVG with a specific price level, (4) the primary fundamental driver right now, (5) your overall bias and whether price is in premium or discount. Be direct and specific.`,
      `${priceCtx}SMC brief for ${asset} today ${new Date().toDateString()}.${newsCtx}`

            <div style={{fontSize:13,color:"var(--text2)",display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
              <span className="spin-teal"/>

                <div style={{fontSize:12,fontWeight:700,minWidth:72,color:"var(--text)"}}>{a}</div>

            ))}

        </div>

            const isRefreshing = loadingOne[asset] || false;

function CalendarTab() {
  const [events,   setEvents]   = useState(null);
  const [loading,  setLoading]  = useState(false);
  const [calError, setCalError] = useState(null);
  const nextRef    = useRef(null);
  const hasFetched = useRef(false);

  // Auto-load this week on mount
  useEffect(() => {
    if (!hasFetched.current) {
      hasFetched.current = true;
      load();
    }
  }, []);

  // Scroll to next event after events load
  useEffect(() => {
    if (events && nextRef.current) {
      setTimeout(()=>nextRef.current?.scrollIntoView({behavior:"smooth",block:"center"}),300);
    }
  }, [events]);

  const load = async (week = "this") => {
    setLoading(true); setEvents(null);
    setCalError(null);
    try {
      // GET request — no Content-Type header (avoids CORS preflight on mobile)
      const url = `${CLAUDE_API}/calendar${week === "next" ? "?week=next" : ""}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Worker returned HTTP ${res.status}`);
      const raw = await res.json();
      if (raw.error) throw new Error(raw.error);
      if (!Array.isArray(raw)) throw new Error("Unexpected response format");

      const IMPACT_MAP = { "High":"high","Medium":"medium","Low":"low","Holiday":"low" };
      const KEEP = new Set(["USD","EUR","GBP","JPY","AUD","CAD","CHF","NZD"]);

      const mapped = raw
        .filter(e => KEEP.has(e.country) && (IMPACT_MAP[e.impact]==="high"||IMPACT_MAP[e.impact]==="medium"))
        .map(e => {
          const d = new Date(e.date);
          const dateStr = d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
          const timeStr = d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"UTC"});
          return {
            date: dateStr,
            time: timeStr==="00:00"?"All Day":timeStr,
            currency: e.country,
            event: e.title,
            impact: IMPACT_MAP[e.impact]||"low",
            previous: e.previous||"—",
            forecast: e.forecast||"—",
            _ts: d.getTime(),
          };
        })
        .sort((a,b)=>a._ts-b._ts);

      setEvents(mapped.length ? mapped : []);
    } catch(err) {
      setCalError(err.message);
      setEvents([]);
    }
    setLoading(false);
  };

  // Determine if an event is past, current/next, or future
  const now = new Date();
  const todayStr = now.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})
    .replace(",","");

  const getEventStatus = (ev) => {
    try {
      // Parse event datetime roughly
      const [hh,mm] = (ev.time||"00:00").split(":").map(Number);
      // We can't perfectly parse "Mon 3 Mar" without year, so use today comparison
      const evDateMatch = ev.date?.match(/(\d+)\s+(\w+)/);
      if (!evDateMatch) return "future";
      const day = parseInt(evDateMatch[1]);
      const curDay = now.getDate();
      if (day < curDay) return "past";
      if (day > curDay) return "future";
      // Same day — compare time
      const evMinutes = hh*60+mm;
      const nowMinutes = now.getHours()*60+now.getMinutes();
      if (evMinutes < nowMinutes) return "past";
      if (evMinutes <= nowMinutes+60) return "next";
      return "future";
    } catch { return "future"; }
  };

  const grouped = events ? events.reduce((acc,e)=>{(acc[e.date]=[...(acc[e.date]||[]),e]);return acc;},{}) : {};
  let foundNext = false;

  return (
    <>
      <div className="greeting-section" style={{paddingBottom:12}}>
        <div className="greeting-text" style={{fontSize:22}}>Economic Calendar</div>
        <div className="greeting-sub">
          {new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})} ·{" "}
          {new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}
        </div>
      </div>

      <div className="cal-section">
        {/* Refresh row */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <div style={{fontSize:12,color:"var(--text3)"}}>
            {events ? `${events.length} events this week` : loading ? "Loading events…" : ""}
          </div>
          <button onClick={load} disabled={loading}
            style={{background:"var(--card)",border:"1px solid var(--border2)",borderRadius:8,color:"var(--text2)",fontSize:12,padding:"6px 12px",cursor:"pointer",fontFamily:"var(--font)",display:"flex",alignItems:"center",gap:6,fontWeight:600}}>
            {loading?<><span className="spin-teal"/>Loading…</>:"↺ Refresh"}
          </button>
        </div>

        {loading&&(
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {Array(10).fill(0).map((_,i)=><div key={i} className="shimmer" style={{height:58,borderRadius:12}}/>)}
          </div>
        )}

        {calError&&<div className="empty-state" style={{color:"var(--red)",fontSize:12,lineHeight:1.6}}>
          ⚠ {calError}<br/>
          <span style={{color:"var(--text3)",fontSize:11}}>Make sure your Cloudflare Worker has been updated with the new code.</span>
        </div>}
        {!calError&&events&&events.length===0&&<div className="empty-state">No events found. Tap ↺ Refresh to try again.</div>}

        {events&&events.length>0&&Object.entries(grouped).map(([date,dayEvs])=>(
          <div className="cal-day-group" key={date}>
            <div className="cal-day-label">{date}</div>
            {dayEvs.map((ev,i)=>{
              const status = getEventStatus(ev);
              const isNext = status==="next"&&!foundNext;
              if (isNext) foundNext = true;
              return (
                <div
                  key={i}
                  ref={isNext?nextRef:null}
                  className={`cal-event-row ${isNext||status==="next"?"upcoming":status==="past"?"past":""}`}
                >
                  <div className="cal-time-col">
                    {isNext&&<div className="next-up-label">▶ NEXT</div>}
                    {ev.time||"—"}
                  </div>
                  <span className="cal-currency-badge">{ev.currency}</span>
                  <div>
                    <div className="cal-event-name">{ev.event}</div>
                    <div className="cal-prev-fcst">Prev: {ev.previous||"—"} · Fcst: {ev.forecast||"—"}</div>
                  </div>
                  <span className={`impact-pill ${ev.impact}`}>{ev.impact}</span>
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </>
  );
}

const EMPTY_FORM = {date:new Date().toISOString().slice(0,10),pair:"EUR/USD",direction:"Long",session:"London",time:"",lots:"",pnl:"",rr:"",outcome:"Win",notes:""};

function calcStats(trades) {
  if(!trades.length) return null;
  const wins=trades.filter(t=>t.outcome==="Win").length;
  const wr=((wins/trades.length)*100).toFixed(0);
  const totalPnl=trades.reduce((a,t)=>a+(parseFloat(t.pnl)||0),0).toFixed(2);
  const rrs=trades.map(t=>parseFloat(t.rr)).filter(Boolean);
  const avgRR=rrs.length?(rrs.reduce((a,b)=>a+b,0)/rrs.length).toFixed(1):"—";
  const pairMap={};
  trades.forEach(t=>{(pairMap[t.pair]=pairMap[t.pair]||{w:0,t:0});pairMap[t.pair].t++;if(t.outcome==="Win")pairMap[t.pair].w++;});
  const bestPair=Object.entries(pairMap).sort((a,b)=>(b[1].w/b[1].t)-(a[1].w/a[1].t))[0]?.[0]||"—";
  const dayMap={};
  trades.forEach(t=>{const d=new Date(t.date).toLocaleDateString("en-GB",{weekday:"short"});(dayMap[d]=dayMap[d]||{pnl:0}).pnl+=(parseFloat(t.pnl)||0);});
  const bestDay=Object.entries(dayMap).sort((a,b)=>b[1].pnl-a[1].pnl)[0]?.[0]||"—";
  const worstDay=Object.entries(dayMap).sort((a,b)=>a[1].pnl-b[1].pnl)[0]?.[0]||"—";
  const pl=Object.entries(pairMap).map(([pair,d])=>({pair,wr:((d.w/d.t)*100).toFixed(0),t:d.t})).sort((a,b)=>b.wr-a.wr).slice(0,4);
  return{wins,total:trades.length,wr,totalPnl,avgRR,bestPair,bestDay,worstDay,pl};
}

              <span className={`tc-tag ${t.outcome.toLowerCase()}`}>{t.outcome}</span>
              <span className="tc-tag">{t.session}</span>
              {t.time&&<span className="tc-tag">⏱ {t.time}</span>}
              {t.rr&&<span className="tc-tag">{t.rr}R</span>}
              <span className="tc-tag">{t.date}</span>
            </div>
            {t.notes&&<div style={{fontSize:11,color:"var(--text3)",marginTop:8,lineHeight:1.5}}>{t.notes}</div>}
          </div>
        ))}
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  
  </script>

    (function() {
      const sourceEl = document.getElementById('app-source');
      const code = sourceEl.textContent;
      const output = Babel.transform(code, {
        presets: [['react', { runtime: 'classic' }]]
      }).code;
      const script = document.createElement('script');
      script.textContent = output;
      document.body.appendChild(script);
